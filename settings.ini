[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/fastai/nbdev/blob/master/settings.ini for examples.

### Python library ###
repo = PhysioJEPA
lib_name = %(repo)s
version = 0.0.1
min_python = 3.9
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = physiojepa
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = benmfox
author_email = benmfox@me.com
copyright = 2023 onwards, %(author)s
description = PhysioJEPA
keywords = nbdev jupyter notebook python
language = English
status = 3
user = benmfox

### Optional ###
requirements = setuptools>=64.0,<75.0 optuna==3.6.1 optuna-integration wandb==0.19.2 scikit-learn ipykernel nbdev==2.4.14 tqdm scipy zarr dask torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 torchmetrics==1.6.1 seaborn matplotlib pyyaml numpy pandas plotly==5.15.0 lightning==2.5.0 rotary-embedding-torch transformers==4.51.3
